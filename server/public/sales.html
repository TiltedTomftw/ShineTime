<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shinetime Sales View</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #667eea;
      --accent: #f59e0b;
      --success: #10b981;
      --bg: #eef1f7;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Work Sans', system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, rgba(102, 126, 234, 0.18), transparent 40%),
        radial-gradient(circle at 20% 20%, rgba(245, 158, 11, 0.12), transparent 35%),
        #eef1f7;
    }

    .app {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }

    .hero {
      background: #ffffff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(102, 126, 234, 0.18);
    }

    .hero h1 {
      font-family: 'Space Grotesk', sans-serif;
      margin: 0 0 8px;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
    }

    .panel {
      background: white;
      border-radius: 20px;
      padding: 22px;
      margin-top: 22px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 1px;
      font-weight: 600;
    }

    .field input {
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 15px;
      font-family: 'Work Sans', sans-serif;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .btn {
      border: none;
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Work Sans', sans-serif;
      letter-spacing: 0.2px;
    }

    .btn.primary {
      background: var(--brand);
      color: white;
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.25);
    }

    .btn.ghost {
      background: white;
      color: var(--brand);
      border: 1px solid rgba(102, 126, 234, 0.3);
    }

    .result {
      margin-top: 18px;
      border-radius: 18px;
      border: 1px solid var(--border);
      padding: 18px;
      background: #ffffff;
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.06);
    }

    .result h3 {
      margin: 0 0 10px;
      font-family: 'Space Grotesk', sans-serif;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .meta span {
      color: var(--text);
      font-weight: 600;
    }

    .status-pill {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: white;
      background: var(--brand);
    }

    .status-pill.paused { background: var(--accent); }
    .status-pill.completed { background: var(--success); }

    .notes {
      margin-top: 14px;
      display: grid;
      gap: 8px;
    }

    .note {
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 13px;
      color: var(--muted);
    }

    .photo {
      margin-top: 14px;
    }

    .photo img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="hero">
      <h1>Shinetime Sales View</h1>
      <p>Search a stock number to see the latest detailing status.</p>
    </section>

    <section class="panel">
      <div class="field">
        <label for="salesSearch">Stock Number</label>
        <input type="text" id="salesSearch" placeholder="Enter stock number" oninput="searchSales()">
      </div>
      <div class="actions">
        <button class="btn primary" onclick="searchSales()">Search</button>
        <button class="btn ghost" onclick="clearSearch()">Clear</button>
      </div>
      <div id="salesResult"></div>
    </section>
  </div>

  <script>
    function formatDateTime(timestamp) {
      return new Date(timestamp).toLocaleString();
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function clearSearch() {
      document.getElementById('salesSearch').value = '';
      document.getElementById('salesResult').innerHTML = '';
    }

    async function searchSales() {
      const query = document.getElementById('salesSearch').value.trim();
      const resultContainer = document.getElementById('salesResult');

      if (!query) {
        resultContainer.innerHTML = '<div class="empty-state">Enter a stock number to search.</div>';
        return;
      }

      try {
        const response = await fetch('/api/jobs');
        const jobs = await response.json();
        const normalized = query.toUpperCase();
        const matches = jobs.filter(job => (job.stockNumber || '').toUpperCase() === normalized);

        if (!matches.length) {
          resultContainer.innerHTML = '<div class="empty-state">No match found, check with detail!</div>';
          return;
        }

        const latest = matches.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))[0];
        const notes = latest.notes || [];
        const photos = latest.photos || [];
        const latestPhoto = photos[0];
        const latestThumb = latestPhoto ? (latestPhoto.thumbUrl || latestPhoto.url) : '';
        const statusLabel = latest.status ? latest.status.replace('_', ' ') : 'unknown';

        resultContainer.innerHTML = `
          <div class="result">
            <h3>${escapeHtml(latest.make || '?')} ${escapeHtml(latest.model || '?')}</h3>
            <div class="meta">
              <div>Stock: <span>${escapeHtml(latest.stockNumber || 'N/A')}</span></div>
              <div>Status: <span><span class="status-pill ${escapeHtml(latest.status || '')}">${escapeHtml(statusLabel)}</span></span></div>
              <div>Started: <span>${formatDateTime(latest.startTime)}</span></div>
              <div>Detailer: <span>${escapeHtml(latest.detailerName || 'Unknown')}</span></div>
            </div>
            ${latestThumb ? `<div class="photo"><img src="${latestThumb}" alt="Latest photo"></div>` : ''}
            <div class="notes">
              ${notes.length
                ? notes.slice(0, 3).map(note => `
                    <div class="note">
                      <strong>${escapeHtml(note.detailerName || 'Unknown')}</strong> • ${formatDateTime(note.timestamp)}<br>
                      ${escapeHtml(note.text || '')}
                    </div>
                  `).join('')
                : '<div class="note">No notes yet.</div>'}
            </div>
          </div>
        `;
      } catch (error) {
        resultContainer.innerHTML = `<div class="empty-state">Search failed: ${error.message}</div>`;
      }
    }
  </script>
</body>
</html>
